name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyinstaller ttkbootstrap pillow pystray

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name SleepTimerPro Sleep-timer-windows.py

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: SleepTimerPro-Windows
          path: dist/SleepTimerPro.exe
          retention-days: 30
